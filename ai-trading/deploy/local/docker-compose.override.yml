# Local-only overlay for the production compose file. Paths are relative to
# the first compose file (ai-trading/deploy/production/).
services:
  cloudflared:
    profiles: ["production-only"]

  router:
    image: caddy:2-alpine
    volumes:
      - ../local/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8899:8899"
    # `research` added for development only, same as the production gateway
    # (review round 1): ta-research lives on its own dedicated network, not
    # `ta`, so the local mock router must join it too to reach ta-research.
    networks: [hub, ta, ahf, vibe, research, mirofish]
    depends_on:
      web:
        condition: service_started
      ta-terminal:
        condition: service_started
      ta-research:
        condition: service_started
      ahf-terminal:
        condition: service_started
      vibe-trading:
        condition: service_started
      # MiroFish stays disabled (profile-gated) until its sibling compose
      # file is also passed with `-f` and its keys render; `required: false`
      # lets `router` start without it, same tolerance Task 5 proves for
      # production (see docker-compose.mirofish.yml).
      mirofish:
        condition: service_started
        required: false
