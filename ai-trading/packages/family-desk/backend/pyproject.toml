[project]
name = "ai-trading-desk"
version = "0.1.0"
description = "Family Desk backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-trading-common",
    "alembic>=1.13",
    "exchange-calendars>=4.13",
    "fastapi>=0.118",
    "numpy>=2.2",
    "pandas>=2.3",
    "psycopg[binary]>=3.1",
    "pydantic>=2.12",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",  # exact: its output is checked in
    "httpx>=0.27",  # fastapi.testclient.TestClient's transport
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.uv.sources]
ai-trading-common = { path = "../../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/ai_trading/contracts/strategy_spec_v1.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# B008 ("function call in a default argument") is FastAPI's own documented `Depends(...)` idiom
# (https://fastapi.tiangolo.com/tutorial/dependencies/), not a real bug -- FastAPI calls each
# default exactly once per request, not once at import time. Narrowed to `api/`, the only lane-L4
# code using it, rather than disabled repo-wide.
[tool.ruff.lint.per-file-ignores]
"src/ai_trading/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
