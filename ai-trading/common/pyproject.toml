[project]
name = "ai-trading-common"
version = "0.1.0"
description = "Shared provider errors, quality labels, throttled HTTP, and bar hygiene for ai-trading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.13",
    "pandas>=2.3",
    "requests>=2.32",
]

[project.optional-dependencies]
# The IB Gateway wire client, needed only once DESK_IBKR_GATEWAY_ENABLED=1 (providers/ibkr.py imports it lazily).
ibkr = ["ib_async==2.1.0"]  # the version the probe pins (tools/ibkr-probe)

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading_common"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
