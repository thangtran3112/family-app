name: ai-trading-deploy

on:
  push:
    branches: [main]
    paths:
      - "ai-trading/**"
      - "!ai-trading/plans/**"
      - "!ai-trading/**/*.md"
      - ".gitmodules"
      - ".github/workflows/ai-trading-deploy.yml"
      - "common/config/**"
      # Task 5 (app-controls): the Linux installer lives outside ai-trading/
      # entirely -- without this, an installer-only fix would never deploy.
      - "infrastructure/host/app-controls/**"
      # 0001b-1: production compose, Caddyfile, deploy.sh, health-check.sh,
      # render-env.sh and the MiroFish scripts live here now.
      - "infrastructure/apps/ai-trading/**"
      # Docs and the offline tests are not deployed; same rule as ai-trading/** above.
      - "!infrastructure/apps/ai-trading/**/*.md"
      - "!infrastructure/apps/ai-trading/tests/**"
  workflow_dispatch:
    inputs:
      deploy_app:
        description: >-
          Build, push, and deploy the four core apps (manual redeploy or
          rollback trigger). A push to main always builds/deploys regardless
          of this input; on a manual dispatch, leave false to run no
          build/deploy job at all -- e.g. for a static-upload-only dispatch.
        type: boolean
        default: false
      activate_mirofish:
        description: >-
          Turn MiroFish on for this deploy (MIROFISH_ACTIVATE=1 to deploy.sh's
          fail-safe opt-in). Only takes effect when deploy_app is also true.
          Without it (and on every push to main) deploy.sh gets
          MIROFISH_ACTIVATE=keep: the persisted app-control preference
          (Task 5, app-controls) is left exactly as it is -- on a first
          activation this adopts whichever app was actually running at
          install time, never re-derived from "is a container running
          right now" on every later deploy.
        type: boolean
        default: false
      stop_mirofish:
        description: >-
          Turn MiroFish off for this deploy (MIROFISH_ACTIVATE=0). Wins over
          activate_mirofish. Only takes effect when deploy_app is also true.
          Updates the same persisted app-control preference (Task 5) a
          Settings switch would.
        type: boolean
        default: false
      upload_hub_static:
        description: >-
          Build the Trading Hub's static export and upload it to its
          dedicated GCS bucket (01h/01e). Leave false for a normal manual
          deploy dispatch; only an operator deliberately setting this true
          runs that job. Never builds/pushes images, runs the deploy job, or
          changes MiroFish's activation state.
        type: boolean
        default: false
      upload_mirofish_static:
        description: >-
          Upload MiroFish's static Vue build (Task 3) to its dedicated GCS
          bucket (Task 6). Leave false for a normal manual deploy dispatch;
          only an operator deliberately setting this true runs that job.
        type: boolean
        default: false
      upload_desk_static:
        description: >-
          Build the Family Desk release export and upload its public shell to
          its dedicated bucket. No Clerk key, images, VPS deploy or hostname
          cutover. Run from main after the owner-reviewed bucket/IAM apply.
        type: boolean
        default: false
      target:
        description: >-
          Host the deploy job targets: the Firestore group (shared/<target>)
          its SSH host, port, user, deploy key and known hosts are read from.
          A push to main deploys to laptop (prod serves from the laptop since
          the 2026-11-01 cutover); vps is an explicit opt-in only (stopped
          rollback reference). Only takes effect when deploy_app is also true.
          laptop reaches the host's sshd through Cloudflare Access (the
          cloudflared ProxyCommand with the CI service token), not the tailnet.
        type: choice
        options: [laptop, vps]
        default: laptop
      dark:
        description: >-
          Dark deploy (DEPLOY_DARK=1 to deploy.sh): start the stack without
          cloudflared (the Cloudflare tunnel) and the Desk scheduler, and skip
          the tunnel health probe. For staging or a warm-up on a host that must
          not serve traffic yet. Only takes effect when deploy_app is also true.
        type: boolean
        default: false
      image_tag:
        description: >-
          Deploy this already-pushed GHCR tag (a full 40-character commit SHA)
          and skip the build job, so a dark deploy or a cutover spends no build
          time. Leave empty to build and deploy the dispatched commit. Only
          takes effect when deploy_app is also true.
        type: string
        default: ''

concurrency:
  group: ai-trading-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: tobytran-portfolio
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/807362265280/locations/global/workloadIdentityPools/ai-trading-deploy/providers/github
  GCP_DEPLOY_SERVICE_ACCOUNT: ai-trading-deploy@tobytran-portfolio.iam.gserviceaccount.com
  # Task 6's dedicated, bucket-scoped upload identity (infrastructure/gcp/ai-trading/mirofish-bucket.tf):
  # roles/storage.objectAdmin on the MiroFish static bucket only -- never GCP_DEPLOY_SERVICE_ACCOUNT's
  # broader access. Bound to the same existing deploy Workload Identity pool/provider above.
  GCP_MIROFISH_UPLOAD_SERVICE_ACCOUNT: ai-trading-mirofish-upload@tobytran-portfolio.iam.gserviceaccount.com
  # F1's dedicated, bucket-scoped upload identity (infrastructure/gcp/ai-trading/hub-bucket.tf):
  # roles/storage.objectAdmin on the hub static bucket only -- never GCP_DEPLOY_SERVICE_ACCOUNT's
  # broader access. Bound to the same existing deploy Workload Identity pool/provider above.
  GCP_HUB_UPLOAD_SERVICE_ACCOUNT: ai-trading-hub-upload@tobytran-portfolio.iam.gserviceaccount.com
  GCP_DESK_UPLOAD_SERVICE_ACCOUNT: ai-trading-desk-upload@tobytran-portfolio.iam.gserviceaccount.com

jobs:
  # F1: runs on every push to main, or a manual dispatch with deploy_app=true.
  # A bare manual "Run workflow" click (every input left at its false
  # default) runs neither build nor deploy -- e.g. for a static-upload-only
  # dispatch (upload_hub_static / upload_mirofish_static below).
  build:
    name: Build and push images
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_app == true && inputs.image_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Verify Vibe family overlay before any image build
        run: bash ai-trading/deploy/ci/test-vibe-overlay.sh
      # F1 fix round 1: fail closed BEFORE any image is built or pushed in
      # this job -- including the smoke build below, which never ships but
      # runs in the same job as the real push. A nonempty fake pk_test_ or a
      # valid pk_live_ key from the WRONG Clerk instance previously passed
      # Bake's mere-nonempty check, and Buildx's concurrent per-target push
      # could land sibling images (ta-terminal/vibe-trading/auth/...) in
      # GHCR before the "web" target's own requireClerkPublishableKey()
      # build-time throw ever surfaced. This shared validator (also used by
      # hub-static-upload below) requires a pk_live_ key decoding to this
      # app's own Clerk Frontend API domain, never prints the key/decoded
      # value, and gates every later step in this job.
      - name: Validate production Clerk publishable key
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: ai-trading/deploy/ci/check-clerk-publishable-key.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build images for smoke tests
        uses: docker/bake-action@v7
        env:
          TAG: ci
          # Syntactically valid but fake Clerk publishable key (decodes to
          # "ci-fake.clerk.accounts.dev$"): this build never ships, so it
          # must never see the real, repo-variable-sourced key below.
          CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZmFrZS5jbGVyay5hY2NvdW50cy5kZXYk
        with:
          files: |
            ai-trading/deploy/docker-bake.hcl
            ai-trading/deploy/docker-bake.ci.hcl
          # Read CI caches but never block a production deploy on optional
          # cache uploads (a MiroFish layer upload exhausted the 60m job budget).
          set: '*.cache-to='
          load: true
      - name: Build MiroFish static frontend for smoke tests
        # smoke-test.sh all checks this export.
        uses: docker/bake-action@v7
        env:
          TAG: ci
        with:
          provenance: false
          files: |
            ai-trading/deploy/docker-bake.hcl
            ai-trading/deploy/docker-bake.ci.hcl
          set: '*.cache-to='
          targets: mirofish-frontend
      - name: Smoke tests
        env:
          TAG: ci
        run: ai-trading/deploy/ci/smoke-test.sh all
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push immutable images
        uses: docker/bake-action@v7
        env:
          TAG: ${{ github.sha }}
          # Public, non-secret Clerk publishable key copied from Firestore
          # ai-trading/clerk PUBLISHABLE_KEY into this repo-scoped GitHub
          # Actions variable by the operator (see common/config/README.md
          # "GitHub copies"). Bake's CLERK_PUBLISHABLE_KEY variable defaults
          # to "" when this is unset, which fails the frontend's own
          # requireClerkPublishableKey() at build time -- the production
          # build must never silently ship with a fake or missing key.
          CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        with:
          files: |
            ai-trading/deploy/docker-bake.hcl
          push: true

  deploy:
    name: Deploy to the VPS
    # `build` is skipped (not failed) when an image_tag is dispatched, so the
    # default `needs` gate would skip this job too: accept skipped, never failed.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_app == true)) }}
    needs: build
    runs-on: ubuntu-latest
    environment: ai-trading-production
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      # Firestore group holding the host's SSH details (VPS_HOST, VPS_PORT, VPS_USER,
      # VPS_DEPLOY_SSH_PRIVATE_KEY, VPS_SSH_KNOWN_HOSTS). Push to main is always laptop.
      TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || 'laptop' }}
      # Already-pushed tag to deploy; empty means the commit this run built.
      IMAGE_TAG_INPUT: ${{ (github.event_name == 'workflow_dispatch' && inputs.image_tag) || '' }}
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          case "$TARGET" in vps | laptop) ;; *) echo "target must be vps or laptop" >&2; exit 1 ;; esac
          if [[ -n "$IMAGE_TAG_INPUT" && ! "$IMAGE_TAG_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            infrastructure/apps/ai-trading
            ai-trading/control
            infrastructure/host/app-controls
            common/config
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Render production env files
        run: infrastructure/apps/ai-trading/render-env.sh "$RUNNER_TEMP/ai-trading-env"

      # target=laptop only: the laptop's sshd is reached through the ai-trading
      # tunnel behind a Cloudflare Access application, not the tailnet. The CI
      # service token (Service Auth policy) opens the SSH websocket headlessly:
      # `cloudflared access ssh` sends it as CF-Access-Client-Id/Secret, so no
      # browser login happens. This job has GCP auth, so the token and the SSH
      # hostname are read from Firestore (shared/laptop, ai-trading/cloudflare),
      # masked, and handed to later steps through the environment; the
      # ai-trading-production environment holds no copies of them. The token
      # travels in TUNNEL_SERVICE_TOKEN_* env vars, never in a command line.
      - name: Install cloudflared
        if: ${{ env.TARGET == 'laptop' }}
        run: |
          set -euo pipefail
          # Pinned release; the digest is the one GitHub publishes for the asset.
          version=2026.10.7
          sha256=1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-linux-amd64"
          echo "$sha256  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
          rm -f "$RUNNER_TEMP/cloudflared"
          cloudflared --version

      - name: Read Cloudflare Access SSH credentials
        if: ${{ env.TARGET == 'laptop' }}
        run: |
          set -euo pipefail
          get_val() { common/config/family_config.py get "$1" "$2" | awk '/^::add-mask::/ { print > "/dev/stderr"; next } { print }'; }
          ssh_host="$(get_val ai-trading/cloudflare TF_VAR_laptop_ssh_hostname)"
          token_id="$(get_val shared/laptop CLOUDFLARE_ACCESS_CI_CLIENT_ID)"
          token_secret="$(get_val shared/laptop CLOUDFLARE_ACCESS_CI_CLIENT_SECRET)"
          for value in "$ssh_host" "$token_id" "$token_secret"; do
            [[ -n "$value" ]] || { echo "laptop SSH needs TF_VAR_laptop_ssh_hostname (ai-trading/cloudflare) and CLOUDFLARE_ACCESS_CI_CLIENT_ID/SECRET (shared/laptop)" >&2; exit 1; }
            echo "::add-mask::$value"
          done
          {
            echo "CF_SSH_HOST=$ssh_host"
            echo "TUNNEL_SERVICE_TOKEN_ID=$token_id"
            echo "TUNNEL_SERVICE_TOKEN_SECRET=$token_secret"
            echo "SSH_PROXY_COMMAND=cloudflared access ssh --hostname %h"
          } >>"$GITHUB_ENV"

      - name: Fetch VPS deploy SSH key and known hosts
        run: |
          set -euo pipefail
          umask 077
          # Older family_config.py prints ::add-mask:: lines on stdout; move them to
          # stderr (still processed by the runner) so the files hold only the value.
          get_file() { common/config/family_config.py get "$1" "$2" | awk '/^::add-mask::/ { print > "/dev/stderr"; next } { print }' >"$3"; }
          get_file "shared/$TARGET" VPS_DEPLOY_SSH_PRIVATE_KEY "$RUNNER_TEMP/ssh-key"
          chmod 600 "$RUNNER_TEMP/ssh-key"
          # Multi-line, so read from the shared group (profile values must be single-line).
          get_file "shared/$TARGET" VPS_SSH_KNOWN_HOSTS "$RUNNER_TEMP/ai-trading-known-hosts"

      - name: Deploy over SSH
        env:
          GHCR_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.image_tag) || github.sha }}
          SSH_KEY_FILE: ${{ runner.temp }}/ssh-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/ai-trading-known-hosts
          ENV_DIR: ${{ runner.temp }}/ai-trading-env
          # '0' on a dispatch with stop_mirofish=true, else '1' with
          # activate_mirofish=true, else 'keep' (every push to main):
          # deploy.sh keeps MiroFish on only if a mirofish container is
          # running now and its profile still renders valid. A failed
          # activation never fails the other three apps' deploy.
          MIROFISH_ACTIVATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.stop_mirofish == true) && '0' || ((github.event_name == 'workflow_dispatch' && inputs.activate_mirofish == true) && '1' || 'keep') }}
          # '1' only on a dispatch with dark=true: deploy.sh then leaves cloudflared and the
          # Desk scheduler out and health-check.sh skips the tunnel probe. Every push is '0'.
          DEPLOY_DARK: ${{ (github.event_name == 'workflow_dispatch' && inputs.dark == true) && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GITHUB_TOKEN"
          DEPLOY_SCRIPT="$RUNNER_TEMP/deploy-remote.sh"
          cat >"$DEPLOY_SCRIPT" <<'SCRIPT_EOF'
          set -Eeuo pipefail
          umask 077
          proxy_opts=()
          [[ -z "${SSH_PROXY_COMMAND:-}" ]] || proxy_opts=(-o "ProxyCommand=$SSH_PROXY_COMMAND")
          ssh_opts=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -p "$VPS_PORT" "${proxy_opts[@]}")
          scp_opts=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -P "$VPS_PORT" "${proxy_opts[@]}")
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 /tmp/ai-trading-deploy /tmp/ai-trading-deploy/env /tmp/ai-trading-deploy/config /tmp/ai-trading-deploy/config/control /tmp/ai-trading-deploy/config/deploy/production /tmp/ai-trading-deploy/bootstrap/ai-trading/control"
          # Only the controller (deploy.sh) and its config CLI (family_config.py)
          # are installed directly below; the four declarative config files are
          # staged, never pre-installed as active config -- deploy.sh itself now
          # validates, backs up, and atomically installs them (A10a).
          scp "${scp_opts[@]}" \
            infrastructure/apps/ai-trading/deploy.sh \
            common/config/family_config.py \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/"
          scp "${scp_opts[@]}" \
            infrastructure/apps/ai-trading/docker-compose.yml \
            infrastructure/apps/ai-trading/docker-compose.mirofish.yml \
            infrastructure/apps/ai-trading/Caddyfile \
            infrastructure/apps/ai-trading/health-check.sh \
            infrastructure/host/app-controls/ai-trading-control.service \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/config/"
          # Task 5 (app-controls, fix round 1): the control helper's own
          # code/catalog and the standalone MiroFish preparer it depends on
          # at its deployed location -- staged alongside the files above, in
          # the SAME nested layout deploy.sh's own APP_CONFIG_STAGING_DIR
          # expects (control/runtime.py's PREPARE_MIROFISH_SCRIPT resolves
          # relative to its own installed path; see that module's
          # docstring). deploy.sh -- never the bootstrap step below -- owns
          # installing/backing up/restoring all of these plus the unit file
          # above, so its own stage_configs()/stage_unit() backup always
          # captures whatever genuinely prior version was already on the
          # VPS before this run, never content this same run just wrote
          # (task-5-review fix round 1, Critical #1).
          scp "${scp_opts[@]}" \
            ai-trading/control/catalog.json \
            ai-trading/control/state.py \
            ai-trading/control/runtime.py \
            ai-trading/control/server.py \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/config/control/"
          scp "${scp_opts[@]}" \
            infrastructure/apps/ai-trading/mirofish-runtime.sh \
            infrastructure/apps/ai-trading/prepare-mirofish.sh \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/config/deploy/production/"
          # The Linux BOOTSTRAP (infrastructure/host/app-controls/install.sh)
          # and the two files it actually runs (never installs) from its own
          # staged source -- no provider keys, pure code. It never touches
          # $APP_DIR/control or any unit file; deploy.sh's own transaction
          # above owns those end-to-end.
          scp "${scp_opts[@]}" \
            infrastructure/host/app-controls/install.sh \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/bootstrap/"
          scp "${scp_opts[@]}" \
            ai-trading/control/catalog.json \
            ai-trading/control/state.py \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/bootstrap/ai-trading/control/"
          scp "${scp_opts[@]}" "$ENV_DIR"/*.env "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/env/"
          # shellcheck disable=SC2029 # GHCR_USER and IMAGE_TAG expand on the runner on purpose
          printf '%s\n' "$GITHUB_TOKEN" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "read -r GH_TOKEN; set -Eeuo pipefail; DOCKER_CONFIG=/dev/shm/ai-trading-docker-config-\$\$; cleanup() { sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker logout ghcr.io >/dev/null 2>&1 || true; sudo rm -rf \"\$DOCKER_CONFIG\" /tmp/ai-trading-deploy; }; trap cleanup EXIT; sudo install -d -o root -g root -m 0700 \"\$DOCKER_CONFIG\"; printf '%s' \"\$GH_TOKEN\" | sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker login ghcr.io --username '$GHCR_USER' --password-stdin; sudo install -d -m 0755 /opt/family-app/ai-trading; sudo install -o root -g root -m 0755 /tmp/ai-trading-deploy/family_config.py /opt/family-app/ai-trading/family_config.py; sudo install -o root -g root -m 0755 /tmp/ai-trading-deploy/deploy.sh /opt/family-app/ai-trading/deploy.sh; sudo bash /tmp/ai-trading-deploy/bootstrap/install.sh --src-dir /tmp/ai-trading-deploy/bootstrap; sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" IMAGE_TAG='$IMAGE_TAG' MIROFISH_ACTIVATE='$MIROFISH_ACTIVATE' DEPLOY_DARK='$DEPLOY_DARK' ENV_STAGING_DIR=/tmp/ai-trading-deploy/env APP_CONFIG_STAGING_DIR=/tmp/ai-trading-deploy/config /opt/family-app/ai-trading/deploy.sh"
          SCRIPT_EOF
          # Host details come straight from the target's Firestore group (the old
          # ai-trading/deploy profile only linked these three names to shared/vps).
          get_val() { common/config/family_config.py get "shared/$TARGET" "$1" | awk '/^::add-mask::/ { print > "/dev/stderr"; next } { print }'; }
          VPS_HOST="$(get_val VPS_HOST)"
          VPS_PORT="$(get_val VPS_PORT)"
          VPS_USER="$(get_val VPS_USER)"
          for value in "$VPS_HOST" "$VPS_PORT" "$VPS_USER"; do echo "::add-mask::$value"; done
          # target=laptop: ssh to the Cloudflare Access hostname (the ProxyCommand
          # ignores the port) and re-key the pinned host keys from the stored
          # address to that hostname. The key material stays pinned and
          # StrictHostKeyChecking stays yes; only the label changes.
          if [[ -n "${CF_SSH_HOST:-}" ]]; then
            awk -v h="[$CF_SSH_HOST]:$VPS_PORT" '!/^#/ && NF >= 3 { print h, $2, $3 }' "$KNOWN_HOSTS_FILE" >"$KNOWN_HOSTS_FILE.cf"
            mv "$KNOWN_HOSTS_FILE.cf" "$KNOWN_HOSTS_FILE"
            VPS_HOST="$CF_SSH_HOST"
          fi
          export VPS_HOST VPS_PORT VPS_USER
          bash "$DEPLOY_SCRIPT"

      - name: Remove runner deploy material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ssh-key" "$RUNNER_TEMP/ai-trading-known-hosts" \
            "$RUNNER_TEMP/ai-trading-env" "$RUNNER_TEMP/deploy-remote.sh"

  # F1: hub static staging upload (01h/01e). Fully additive and independent
  # of `build`/`deploy` above -- it never builds or pushes a GHCR image, never
  # runs `deploy.sh`, and never touches MiroFish's activation state. Two
  # independent gates must BOTH hold:
  #   1. `github.event_name == 'workflow_dispatch'` -- a push to main (the
  #      other trigger on this workflow) can never satisfy this.
  #   2. The typed boolean input `upload_hub_static` must be explicitly set
  #      true on that manual dispatch (default false, so a bare manual
  #      "Run workflow" click for a normal deploy still never uploads).
  # `environment: ai-trading-production` below is REQUIRED, not cosmetic:
  # infrastructure/gcp/ai-trading/main.tf's WIF provider attribute_condition
  # checks `assertion.environment == var.github_environment`
  # (`ai-trading-production`), so any other GitHub Environment name on a job
  # that authenticates over this pool fails Google's OIDC exchange closed.
  # The boolean gate above, not this environment name, is what prevents an
  # unwanted upload; the environment only has to match Terraform's provider
  # for the OIDC token to be accepted at all. It builds the hub's Next.js
  # static export directly with pnpm (no Docker), authenticates as the
  # dedicated, bucket-scoped ai-trading-hub-upload identity (hub-bucket.tf)
  # -- never GCP_DEPLOY_SERVICE_ACCOUNT -- and uploads only to the hub bucket
  # named by the operator-set repository variable HUB_STATIC_BUCKET (copied
  # from Terraform's `hub_bucket_name` output, the same manual-copy pattern
  # this workflow already uses for NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY).
  hub-static-upload:
    name: Upload hub static build (operator-gated)
    if: github.event_name == 'workflow_dispatch' && inputs.upload_hub_static == true
    environment: ai-trading-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ai-trading/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ai-trading/frontend
            ai-trading/deploy/ci
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ai-trading/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # F1 fix round 1: same shared, fail-closed validator as the `build`
      # job above -- a manual hub-static publish must never ship a build
      # keyed to an absent, test-mode, malformed, or other-instance Clerk
      # key, and this runs BEFORE `pnpm build` (and therefore before the GCS
      # upload step further below) ever starts. Never prints the key or its
      # decoded value.
      - name: Validate production Clerk publishable key
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: ../deploy/ci/check-clerk-publishable-key.sh

      - name: Build static export
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Check static export
        run: ../deploy/ci/check-static-export.sh out

      - name: Authenticate to Google Cloud (hub static uploader)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_HUB_UPLOAD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload hub static build to GCS
        run: |
          set -euo pipefail
          bucket="${{ vars.HUB_STATIC_BUCKET }}"
          if [[ -z "$bucket" ]]; then
            echo "HUB_STATIC_BUCKET is not set; refusing to upload" >&2
            exit 1
          fi
          ../deploy/ci/upload-hub-static.sh out "$bucket"

  # Desk has no Clerk bundle/key. Like the hub, upload is an explicit
  # main-only dispatch (also enforced by WIF) and never applies Terraform.
  desk-static-upload:
    name: Upload Desk static release (operator-gated)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_desk_static == true
    environment: ai-trading-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ai-trading/packages/family-desk/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ai-trading/packages/family-desk/frontend
            ai-trading/packages/family-desk/contracts
            ai-trading/deploy/ci
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ai-trading/packages/family-desk/frontend/pnpm-lock.yaml
      # link:../contracts does not install the linked package's Zod dependency.
      - run: pnpm --dir ../contracts install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Build Desk static export from release commit
        run: pnpm build
      - name: Check Desk export
        run: ../../../deploy/ci/check-static-export.sh out desk
      - name: Authenticate to Google Cloud (Desk static uploader)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DESK_UPLOAD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload Desk static build to GCS
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?GCP_PROJECT_ID is not set; refusing to upload}"
          # Same project-derived name as desk-bucket.tf and the Worker binding.
          ../../../deploy/ci/upload-hub-static.sh out "${GCP_PROJECT_ID}-ai-trading-desk" desk

  # MiroFish static staging upload (Task 7). Fully additive and independent
  # of `build`/`deploy` above: a repository *variable* existing is NOT
  # sufficient to run this job (fix round 1 Critical finding -- a bucket
  # name variable must not double as an enable switch). Two independent
  # gates must BOTH hold:
  #   1. `github.event_name == 'workflow_dispatch'` -- a push to main (the
  #      other trigger on this workflow) can never satisfy this, no matter
  #      what repository variables exist.
  #   2. The typed boolean input `upload_mirofish_static` must be explicitly
  #      set true on that manual dispatch (default false, so a bare manual
  #      "Run workflow" click for a normal deploy still never uploads).
  # `environment: ai-trading-production` below is REQUIRED, not cosmetic, for
  # the same reason as hub-static-upload above: infrastructure/gcp/ai-trading
  # /main.tf's WIF provider attribute_condition checks
  # `assertion.environment == var.github_environment` (`ai-trading-
  # production`); the previously used `ai-trading-mirofish-upload` GitHub
  # Environment name does not match that condition, so Google's OIDC
  # exchange was failing closed (F1 fix). An operator wanting a distinct
  # approval gate for this job must add a required-reviewer rule to the
  # shared `ai-trading-production` GitHub Environment, which also then
  # applies to the `deploy` job above -- see the production README.
  # It never runs on a pull_request build at all (this workflow has no
  # pull_request trigger). It authenticates as the dedicated, bucket-scoped
  # ai-trading-mirofish-upload identity (Task 6) -- never
  # GCP_DEPLOY_SERVICE_ACCOUNT -- and uploads only to the MiroFish static
  # bucket named by the operator-set repository variable
  # AI_TRADING_MIROFISH_BUCKET_NAME (copied from Terraform's
  # `mirofish_bucket_name` output, the same manual-copy pattern this
  # workflow already uses for NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY) -- that
  # variable now configures WHERE to upload, never WHETHER to upload. This is
  # the staging upload step only: it never applies Terraform, never touches
  # Cloudflare, and never runs the `deploy` job's VPS/Firestore/Clerk steps.
  mirofish-static-upload:
    name: Upload MiroFish static build (operator-gated)
    if: github.event_name == 'workflow_dispatch' && inputs.upload_mirofish_static == true
    environment: ai-trading-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build MiroFish static frontend
        uses: docker/bake-action@v7
        with:
          # The local exporter must contain Vue assets only,
          # not provenance.json (which the public uploader rejects).
          provenance: false
          files: |
            ai-trading/deploy/docker-bake.hcl
          targets: mirofish-frontend

      - name: Authenticate to Google Cloud (MiroFish static uploader)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_MIROFISH_UPLOAD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload MiroFish static build to GCS
        run: |
          set -euo pipefail
          bucket="${{ vars.AI_TRADING_MIROFISH_BUCKET_NAME }}"
          if [[ -z "$bucket" ]]; then
            echo "AI_TRADING_MIROFISH_BUCKET_NAME is not set; refusing to upload" >&2
            exit 1
          fi
          ai-trading/deploy/ci/upload-mirofish-static.sh ai-trading/frontend-artifacts/mirofish "$bucket"
