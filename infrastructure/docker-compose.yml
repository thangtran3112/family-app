services:
  # ─── 1. Primary Relational & Vector DB (PostgreSQL 17 + pgvector) ───
  postgres:
    image: pgvector/pgvector:pg17
    container_name: expense-tax-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: expense_tax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Temporal Knowledge Graph DB (Neo4j Community 5.26+) ───
  neo4j:
    image: neo4j:5.26-community
    container_name: expense-tax-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Temporal Workflow Engine Server ───
  temporal:
    image: temporalio/auto-setup:latest
    container_name: expense-tax-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgrespassword
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 4. Temporal Web Admin UI ───
  temporal-ui:
    image: temporalio/ui:latest
    container_name: expense-tax-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    depends_on:
      - temporal

  # ─── 5. Core Python FastAPI Backend ───
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: expense-tax-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/expense_tax_db
      SECRET_KEY: dev-secret-key-change-in-production-expense-tax-2026
      TEMPORAL_HOST: temporal:7233
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      STORAGE_BACKEND: local
    volumes:
      - ../backend:/app
      - backend_storage:/tmp/expense_tax_storage
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 6. Gateway Ingress (Nginx 1.27+) ───
  nginx:
    image: nginx:1.27-alpine
    container_name: expense-tax-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  backend_storage:
