# App config for family-app/infrastructure/host/bootstrap.sh --app <this file>
# Sourced as bash. Paths are relative to the repo root.
#
# Provisions the market-data bridge's H1 archive database and role in the shared cluster
# (README.md, "Market-data H1 archive"). It lives beside the compose file it belongs to, not in
# infrastructure/host/apps/ with the other app configs: bootstrap.sh takes any path for --app.

APP_NAME="ai-trading-market-archive"
POSTGRES_DB_NAME="ai_trading_market_archive_db"
# Must agree with the image the live cluster already runs (see ai-trading-desk.conf).
POSTGRES_IMAGE="pgvector/pgvector:pg17"

ROLE_INIT_SCRIPT_REPO_RELATIVE_PATH="ai-trading/packages/market-data/bridge/docker/postgres/zz-20-market-archive-roles.sh"

# 30-postgres.sh re-applies EVERY app's role script in ${SHARED_PG_DIR}/initdb on each run, and
# passes each script only the variables named here. Naming only this app's password would make the
# expense-tax and Desk scripts fail on "Missing required PostgreSQL role variable". So this lists
# every password the cluster's scripts need; names already in the cluster's .env are reused,
# never regenerated.
REQUIRED_PASSWORD_VARS="APP_MIGRATOR_DB_PASSWORD APP_RUNTIME_DB_PASSWORD FOUNDRY_MIGRATOR_DB_PASSWORD FOUNDRY_RUNTIME_DB_PASSWORD DESK_MIGRATOR_DB_PASSWORD DESK_RUNTIME_DB_PASSWORD MARKET_ARCHIVE_DB_PASSWORD"
