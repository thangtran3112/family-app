[project]
name = "ai-worker"
version = "0.1.0"
description = "Python Temporal worker foundation for expense-tax-management"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.9.0",
    "httpx>=0.28.0",
    "expense-contracts",
]

[tool.uv.sources]
expense-contracts = { path = "../../common/python/expense-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
